<div id="menu_menu_wrapper" class="wa-menu">
    <div class="wa-menu__title" data-i18n="menu_title">メニュー</div>

    <div class="wa-menu__list">
        <!-- クラス名(menu_save 等)はエンジンがクリック結合に使うため保持する -->
        <span class="ui-btn wa-menu__btn menu_save"         data-i18n="menu_save">セーブ</span>
        <span class="ui-btn wa-menu__btn menu_load"         data-i18n="menu_load">ロード</span>
        <span class="ui-btn wa-menu__btn menu_window_close" data-i18n="menu_hide">メッセージを隠す</span>
        <span class="ui-btn wa-menu__btn menu_skip"         data-i18n="menu_skip">スキップ</span>
        <span class="ui-btn wa-menu__btn menu_back_title"   data-i18n="menu_totitle">タイトルへ</span>
    </div>

    <!-- 閉じる（×）。共通の丸い閉じるボタンを流用。クラス menu_close は保持 -->
    <span class="ui-btn ui-btn--close menu_close" role="button">×</span>

    <!-- 現在言語でラベルを流し込む（applyI18n はゲーム起動時に定義済み） -->
    <script>
        (function () {
            if (window.applyI18n) { window.applyI18n('#menu_menu_wrapper'); }
            var c = document.querySelector('#menu_menu_wrapper .menu_close');
            if (c && window.L) { c.setAttribute('title', window.L('common_close')); }
        })();
    </script>
</div>
